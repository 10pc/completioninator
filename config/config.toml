[paths]
replays = "/replays"
database = "/data/db/pipeline.sqlite"
working = "/data/working"
rendered = "/data/rendered"
logs = "/data/logs"

[pipeline]
timezone = "UTC"
min_age_seconds = 5

[render]
danser_home = "/opt/danser"
settings = "pipeline"
# extra danser-cli flags, e.g. ["-noupdatecheck"] once verified (see README).
# WARNING: never add "-nodbcheck" — danser must import newly downloaded maps.
extra_args = []
timeout_seconds = 7200
max_attempts = 3
limit_default = 10
min_free_disk_gb = 5.0

[beatmaps]
# backend: "hinamizawa" (default; direct md5 lookup, graveyard coverage, no key)
#       or "mino" (catboy.best; search-only lookup + official API fallback)
backend = "hinamizawa"
mirror = "https://mirror.hinamizawa.ai"
# Second mirror tried per attempt when the primary misses or blips.
# Empty string disables the fallback.
fallback_backend = "mino"
fallback_mirror = "https://catboy.best"
songs_dir = "/data/beatmaps/songs"

# Optional: official osu! API fallback for hash resolution.
# Free OAuth app at https://osu.ppy.sh/home/account/edit (no callback needed
# for client-credentials flow). Prefer env vars for the secret.
# client_id = 12345
# client_secret = "..."
[osu]

[video]
width = 1920
height = 1080
fps = 30
header_height = 80
# appended to the header line; future home for API-sourced data
header_extra = ""
# rolling batch keeps the longest N rendered-but-uncomposited clips
max_clips = 12
preset = "veryfast"
crf = 23
compose_timeout = 1800
fontfile = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
daily = "/data/daily"
