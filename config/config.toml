[paths]
replays = "/replays"
database = "/data/db/pipeline.sqlite"
working = "/data/working"
rendered = "/data/rendered"
logs = "/data/logs"

[pipeline]
timezone = "UTC"
min_age_seconds = 5

[render]
danser_home = "/opt/danser"
settings = "pipeline"
# Skin folder name under danser/skins (baked into the image; default skin if empty).
skin = "abnormal"
# extra danser-cli flags, e.g. ["-noupdatecheck"] once verified (see README).
# WARNING: never add "-nodbcheck" — danser must import newly downloaded maps.
extra_args = []
timeout_seconds = 7200
max_attempts = 3
limit_default = 10
workers = 3
# Claims older than this (minutes) count as crashed and are requeued.
# Must exceed the longest single render; NULL/legacy claims always reset.
stale_after_minutes = 180
min_free_disk_gb = 5.0

[beatmaps]
# backend: "hinamizawa" (default; direct md5 lookup, graveyard coverage, no key)
#       or "mino" (catboy.best; search-only lookup + official API fallback)
backend = "hinamizawa"
mirror = "https://mirror.hinamizawa.ai"
# Second mirror tried per attempt when the primary misses or blips.
# Empty string disables the fallback.
fallback_backend = "mino"
fallback_mirror = "https://catboy.best"
songs_dir = "/data/beatmaps/songs"

# Optional: official osu! API fallback for hash resolution.
# Free OAuth app at https://osu.ppy.sh/home/account/edit (no callback needed
# for client-credentials flow). Prefer env vars for the secret.
# client_id = 12345
# client_secret = "..."
[osu]

[video]
width = 1920
height = 1080
fps = 30
header_height = 80
# appended to the header line; future home for API-sourced data
header_extra = ""
# rolling batch keeps the longest N rendered-but-uncomposited clips
max_clips = 12
preset = "veryfast"
crf = 23
compose_timeout = 1800
# glide seconds per grid resize; tiny gaps between finishes degrade to cuts
morph_seconds = 1.0
# finish times are floored to this grid (seconds): near-identical durations
# collapse into one boundary instead of sliver segments ffmpeg rejects.
# Trims at most this much tail per clip; 0 disables (exact, fragile).
segment_quant = 0.5
# outro: fades content out, shows completion stats, fades to black
outro_seconds = 6.0
outro_fontsize = 72
outro_fontsize_sub = 54
completion_profile_url = "https://osucomplete.org/u/19333530/osu-ranked"
# manual stat overrides (used only if the profile fetch fails)
# completion_passed = "1,133"
# completion_left = "147,163"
# completion_pct = "0.73%"
fontfile = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
daily = "/data/daily"

[youtube]
# Secrets ONLY via env (this file is committed):
#   PIPELINE_YOUTUBE_CLIENT_ID / PIPELINE_YOUTUBE_CLIENT_SECRET
# Token persists here after the one-time `auth-youtube` browser flow.
token_path = "/data/db/youtube-token.json"
# Unverified Google projects can only upload private/unlisted: start unlisted,
# flip to public after the project audit passes.
privacy = "unlisted"
category_id = "20"
title_template = "osu!completionist journey — {day} ({clips} passes)"
# Delete per-map renders once their day is safely on YouTube (replays, DB
# rows, dailies, songs and logs are always kept). Disable to keep everything.
prune_after_upload = true

[instagram]
# Token + user ID ONLY via env (this file is committed):
#   PIPELINE_INSTAGRAM_USER_ID / PIPELINE_INSTAGRAM_TOKEN
# Needs: IG professional account + linked FB Page + Meta app token with
# instagram_basic, instagram_content_publish (+ pages perms). Feed VIDEO posts
# (landscape dailies are not Reels-shaped). Tokens live ~60 days; a 190 error
# means re-issue.
api_version = "v25.0"
caption_template = "OSU! Completionist — {day} ({clips} maps)"
